<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Навигатор поступления</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1F3A68">
<script>try{var th=localStorage.getItem("nav.theme");if(th)document.documentElement.dataset.theme=th}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}
/* Layout: шапка с языком и отсчётом до ближайшего дедлайна → вкладки (План / Программы / ЕНТ / Документы / Новости) → одна колонка, на широком экране две */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --ink:#14233A; --muted:#5B6B7C; --line:#DCE3E8;
  --accent:#0B7C83; --accent-soft:#DDF1F1; --lapis:#1F3A68; --warn:#B4541A; --warn-soft:#FBEADF; --ok:#2E7D4F; --ok-soft:#E1F2E7;
  --bad:#B23B3B; --bad-soft:#F7E1E1; --sun:#C98A12; --sun-soft:#F8ECD0;
  --sci:#6B4BB8; --sci-soft:#ECE6F8; --shadow:0 6px 18px rgba(20,35,58,.10);
  --display:"Lora",Georgia,"Times New Roman",serif; --body:"Lora",Georgia,"Times New Roman",serif;
  --dur-1:120ms; --dur-2:220ms; --dur-3:420ms; --stagger:40ms;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in-out:cubic-bezier(.65,0,.35,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#16212D; --ink:#E6EDF3; --muted:#93A3B3; --line:#263443;
  --accent:#3FC1C4; --accent-soft:#163A3E; --lapis:#9DB6E4; --warn:#F0A170; --warn-soft:#3A2618; --ok:#6FCB93; --ok-soft:#173527;
  --bad:#EE8A8A; --bad-soft:#3B1E1E; --sun:#E8B54A; --sun-soft:#3A2F15;
  --sci:#B8A2F0; --sci-soft:#2A2340; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#16212D; --ink:#E6EDF3; --muted:#93A3B3; --line:#263443;
  --accent:#3FC1C4; --accent-soft:#163A3E; --lapis:#9DB6E4; --warn:#F0A170; --warn-soft:#3A2618; --ok:#6FCB93; --ok-soft:#173527;
  --bad:#EE8A8A; --bad-soft:#3B1E1E; --sun:#E8B54A; --sun-soft:#3A2F15;
  --sci:#B8A2F0; --sci-soft:#2A2340; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
/* На всю ширину: шапка-полоса от края до края, вкладки прилипают к верху, контент тянется с полями по краям */
:root{--gutter:max(16px,min(4vw,56px))}
.edge{padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
.hero{--hero-bg:linear-gradient(120deg,#1F3A68 0%,#16507A 55%,#0B7C83 100%);--hero-ink:#FFFFFF;--hero-muted:rgba(255,255,255,.78);--hero-glass:rgba(255,255,255,.12);--hero-line:rgba(255,255,255,.22);
  background:var(--hero-bg);color:var(--hero-ink);position:relative;overflow:hidden}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{--hero-bg:linear-gradient(120deg,#132338 0%,#13314A 55%,#0E3D40 100%);--hero-ink:#E6EDF3;--hero-muted:rgba(230,237,243,.72);--hero-glass:rgba(255,255,255,.07);--hero-line:rgba(255,255,255,.14)}}
:root[data-theme="dark"] .hero{--hero-bg:linear-gradient(120deg,#132338 0%,#13314A 55%,#0E3D40 100%);--hero-ink:#E6EDF3;--hero-muted:rgba(230,237,243,.72);--hero-glass:rgba(255,255,255,.07);--hero-line:rgba(255,255,255,.14)}
.hero::before{content:"";position:absolute;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;border:56px solid var(--hero-glass);pointer-events:none}
.hero::after{content:"";position:absolute;right:220px;bottom:-140px;width:260px;height:260px;border-radius:50%;background:var(--hero-glass);pointer-events:none}
header{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-block:28px 32px;position:relative;z-index:1}
.hright{display:flex;flex-direction:column;gap:12px;align-items:flex-end;min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.6vw,44px);line-height:1.1;margin:0;text-wrap:balance;animation:rise var(--dur-3) var(--ease-out) both}
.sub{color:var(--hero-muted);margin:10px 0 0;max-width:62ch;font-size:16px;animation:rise var(--dur-3) var(--ease-out) both;animation-delay:var(--stagger)}
.toprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.themebtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0;transition:background var(--dur-2) var(--ease-out),transform var(--dur-1) var(--ease-out)}
.themebtn svg{width:16px;height:16px;animation:themeIn var(--dur-3) var(--ease-spring)}
@keyframes themeIn{from{transform:rotate(-90deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.brand{display:inline-flex;align-items:center;background:#fff;border-radius:12px;padding:6px 10px;text-decoration:none;flex:none}
.brand img{display:block;height:36px;width:auto}
body{transition:background-color var(--dur-3) var(--ease-out),color var(--dur-3) var(--ease-out)}
.hero .themebtn{border-color:var(--hero-line);background:var(--hero-glass);color:var(--hero-ink)}
.hero .brand{padding:8px 14px;border-radius:16px;margin-bottom:16px;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:rise var(--dur-3) var(--ease-out) both}
.hero .brand img{height:64px}
@media (max-width:640px){.hero .brand img{height:48px}.hero .brand{margin-bottom:12px}}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--surface)}
.hero .langs{border-color:var(--hero-line);background:var(--hero-glass)}
.langs button{font:700 12px var(--body);border:0;background:none;color:var(--muted);padding:4px 10px;border-radius:99px;cursor:pointer;transition:background var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out)}
.hero .langs button{color:var(--hero-muted)}
.langs button[aria-pressed="true"],.hero .langs button[aria-pressed="true"]{background:var(--hero-ink);color:#1F3A68}
.install{font:600 12px var(--body);border:1px solid var(--hero-line);color:var(--hero-ink);background:var(--hero-glass);border-radius:99px;padding:5px 10px;cursor:pointer}
.next{background:var(--hero-glass);border:1px solid var(--hero-line);color:var(--hero-ink);border-radius:16px;padding:16px 20px;min-width:260px;backdrop-filter:blur(6px);animation:rise var(--dur-3) var(--ease-out) both;animation-delay:calc(2*var(--stagger))}
.next .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;display:flex;align-items:center;gap:8px}
.next .n{font-family:var(--display);font-size:clamp(28px,3vw,38px);font-variant-numeric:lining-nums}
.next .t{font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#F0A170;position:relative}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:#F0A170;animation:ping 1.6s var(--ease-out) infinite}
@media (max-width:640px){header{grid-template-columns:1fr;padding-block:20px 24px}.hright{align-items:stretch}.toprow{justify-content:flex-start}.next{min-width:0}.hero::before{width:300px;height:300px;border-width:36px;right:-110px;top:-120px}}
.navbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;gap:2px;flex-wrap:wrap;position:relative}
nav button{font:600 14px var(--body);color:var(--muted);background:none;border:0;padding:10px 12px;cursor:pointer;transition:color var(--dur-1) var(--ease-out)}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--ink)}
nav .ind{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--accent);border-radius:2px;transition:transform var(--dur-2) var(--ease-in-out),width var(--dur-2) var(--ease-in-out)}
nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:99px;background:var(--accent);color:var(--surface);font-size:11px;line-height:18px;text-align:center;animation:pop var(--dur-2) var(--ease-spring) both}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:16px}
.panel.enter{animation:rise var(--dur-3) var(--ease-out) both}
.panel.enter .stg>*{animation:rise var(--dur-3) var(--ease-out) both;animation-delay:calc(min(var(--i,0),10)*var(--stagger))}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.cols3{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
.cols3>.span{grid-column:1/-1}
@media (min-width:1280px){.cols3{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,.9fr)}.cols3>.span{grid-column:auto;position:sticky;top:64px}}
@media (max-width:820px){.cols3{grid-template-columns:1fr}}
@media (min-width:1280px){#groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));column-gap:40px}#groups .g{border-top:0;border-bottom:1px solid var(--line)}}
.subj,.total,#entvalid{max-width:560px}
.box>.note{max-width:120ch}
h2{font-family:var(--display);font-weight:500;font-size:17px;margin:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box.warnbox{border-color:var(--warn);background:linear-gradient(var(--warn-soft),var(--warn-soft)) padding-box}
.boxhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:112px 1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.tl li:first-child{border-top:0}
.date{font-variant-numeric:lining-nums;font-weight:700;font-size:13px}
.ev b{display:block;font-weight:600}
.ev span{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;font-variant-numeric:lining-nums}
.p-soon{background:var(--warn-soft);color:var(--warn)}
.p-ok{background:var(--accent-soft);color:var(--accent)}
.p-good{background:var(--ok-soft);color:var(--ok)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-past{background:transparent;color:var(--muted);border:1px solid var(--line)}
.tag{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
@media (max-width:480px){.tl li{grid-template-columns:1fr auto}.tl .date{grid-column:1/-1}}
.progs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform var(--dur-1) var(--ease-out),box-shadow var(--dur-1) var(--ease-out),border-color var(--dur-2) var(--ease-out)}
.prog.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
@media (hover:hover){.prog:hover,.news:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.prog.on:hover{box-shadow:0 0 0 1px var(--accent),var(--shadow)}}
.prog h3{margin:0;font-size:16px}
.prog .where{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.prog .rec{color:var(--sun);text-transform:none;letter-spacing:0;font-weight:700;white-space:nowrap}
.prog ul{margin:0;padding-left:18px;color:var(--ink);font-size:14px}
.prog a{color:var(--accent);font-weight:600;font-size:13px}
.prog .chg{font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:4px 8px}
.toggle{align-self:flex-start;font:600 13px var(--body);border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent);transition:background var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out),transform var(--dur-1) var(--ease-out)}
.prog.on .toggle{background:var(--accent);color:var(--surface)}
button:active:not(:disabled){transform:scale(.97)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.check input:checked{animation:pop var(--dur-2) var(--ease-spring)}
.check span{background:linear-gradient(currentColor,currentColor) 0 55%/0 1px no-repeat;transition:background-size var(--dur-3) var(--ease-out),color var(--dur-2)}
.check.done span{color:var(--muted);background-size:100% 1px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width var(--dur-3) var(--ease-out)}
.grp{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.docs{width:100%;border-collapse:collapse;font-size:14px}
.docs th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.docs td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
select,input[type=text],input[type=date],input[type=number]{font:14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form input[type=text]{flex:1 1 200px}
.btn{font:600 14px var(--body);background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;transition:transform var(--dur-1) var(--ease-out);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{font-size:13px;padding:6px 10px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
.empty{color:var(--muted);font-size:14px;margin:0}
.note{font-size:13px;color:var(--muted);margin:0}
.link{background:none;border:0;padding:0;font:600 13px var(--body);color:var(--accent);cursor:pointer;text-decoration:none}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.chipset span{font-size:13px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--sun-soft);color:var(--sun)}
.chipset span.p{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.chipset span.p.on{border-color:var(--accent);color:var(--accent)}
/* ЕНТ */
.subj{display:grid;grid-template-columns:1fr 88px;gap:8px 12px;align-items:center}
.subj label{font-size:14px;font-weight:600}
.subj label small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.subj input{width:88px;text-align:right;font-variant-numeric:lining-nums}
.subj input.low{border-color:var(--bad);background:var(--bad-soft)}
.total{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.total .big{font-family:var(--display);font-size:34px;font-variant-numeric:lining-nums}
.floors{display:flex;flex-direction:column;gap:8px}
.floor{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.groups{display:flex;flex-direction:column}
.g{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line)}
.g:first-child{border-top:0}
.g b{font-weight:700}
.g .meta{font-size:12px;color:var(--muted)}
.scale{grid-column:1/-1;position:relative;height:22px}
.scale .rail{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:99px;background:var(--line)}
.scale .rng{position:absolute;top:9px;height:4px;border-radius:99px;background:var(--accent-soft)}
.scale .mk{position:absolute;top:4px;width:2px;height:14px;background:var(--muted);transform:translateX(-1px)}
.scale .mk.med{background:var(--accent)}
.scale .you{position:absolute;top:2px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--sun);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--sun);transition:left var(--dur-3) var(--ease-out)}
/* Новости */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer;transition:background var(--dur-2) var(--ease-out),border-color var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out),transform var(--dur-1) var(--ease-out)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.newsbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.refresh{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--body);color:var(--accent);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.refresh svg,.btn svg{width:14px;height:14px;flex:none}
.refresh.busy svg{animation:spin .9s linear infinite}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.feed.compact{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.news{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;color:inherit;text-decoration:none;min-width:0;transition:transform var(--dur-1) var(--ease-out),box-shadow var(--dur-1) var(--ease-out)}
.feed.compact .news{background:var(--bg)}
.news .meta{display:flex;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.news h3{margin:0;font-size:15px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.news p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cat{font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.c-adm{background:var(--accent-soft);color:var(--accent)}
.c-edu{background:var(--ok-soft);color:var(--ok)}
.c-sci{background:var(--sci-soft);color:var(--sci)}
.new{color:var(--warn);font-weight:700}
.skel{height:110px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(90deg,var(--surface) 0%,var(--line) 50%,var(--surface) 100%) 0 0/200% 100%;animation:shimmer 1.2s linear infinite}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--surface);font-size:14px;font-weight:600;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);animation:rise var(--dur-2) var(--ease-out) both;z-index:9}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{animation-name:toastIn}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

<script>
let TODAY = new Date(); TODAY.setHours(0,0,0,0);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const PROG = Object.fromEntries(PROGRAMS.map(p=>[p.id,p]));
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let picked=load("nav.picked",["nu","ent","usa"]).filter(id=>PROG[id]);
let done=load("nav.done",{});
let docs=load("nav.docs",[
 {t:I18N.ru["ex.0"],type:I18N.ru["doc.0"],d:"2026-12-15",s:1,ex:true},
 {t:I18N.ru["ex.1"],type:I18N.ru["doc.2"],d:"2026-12-01",s:0,ex:true}]);
let ent=load("nav.ent",{s:{},pair:""});
const quest=load("nav.quest",null);
let me=load("nav.me",{n:"",c:""});

const fmt=d=>navFmt(d);
const days=d=>Math.round((new Date(d+"T00:00")-TODAY)/864e5);
function pill(n){if(n<0)return`<span class="pill p-past">${t("past")}</span>`;const c=n<=30?"p-soon":"p-ok";return`<span class="pill ${c}">${n===0?t("today"):t("days",{n})}</span>`}
const eventsOf=p=>p.events.map(e=>navRoll(e,TODAY));
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(msg){document.querySelector(".toast")?.remove();const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),3500)}
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
const pickedEvents=()=>PROGRAMS.filter(p=>picked.includes(p.id)).flatMap(p=>eventsOf(p).map(e=>({...e,p}))).sort((a,b)=>a.d.localeCompare(b.d));
const docTitle=d=>d.ex&&d.t===I18N.ru["ex.0"]?t("ex.0"):d.ex&&d.t===I18N.ru["ex.1"]?t("ex.1"):d.t;
const docType=d=>{const i=[0,1,2,3].find(i=>I18N.ru["doc."+i]===d.type);return i==null?d.type:t("doc."+i)};

/* ---------- Изменения на сайтах приёма (pages.js пишет check-pages.mjs раз в день) ---------- */
const WATCH=window.PAGE_WATCH||null;
const changedAt=id=>{const w=WATCH?.pages?.[id];return w?.changed&&Date.now()-w.changed<14*864e5?w.changed:0};

/* ---------- Квест → программы ---------- */
function questRecs(){if(!quest?.top?.length)return{progs:[],pair:""};
  const progs=[...new Set(quest.top.slice(0,2).flatMap(a=>QUEST_MAP[a]?.progs||[]))];
  return{progs,pair:QUEST_MAP[quest.top[0]]?.pair||""}}

let shownDays=0;
function countUp(el,to){
  if(REDUCED||to===shownDays){el.textContent=t("days",{n:to});shownDays=to;return}
  const from=shownDays,t0=performance.now();shownDays=to;
  (function step(now){const k=Math.min(1,(now-t0)/600),v=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));el.textContent=t("days",{n:v});if(k<1)requestAnimationFrame(step)})(t0);
}

function render(){
  const evs=pickedEvents();
  const up=evs.filter(e=>days(e.d)>=0);
  document.getElementById("timeline").innerHTML=evs.length?[...up,...evs.filter(e=>days(e.d)<0)].map(e=>`<li><span class="date">${fmt(e.d)}</span><span class="ev"><b>${L(e.p.name)}${e.exp?`<span class="tag">${t("exp")}</span>`:""}</b><span>${L(e.t)}</span></span>${pill(days(e.d))}</li>`).join(""):`<li><span class="empty">${t("plan.tlEmpty")}</span></li>`;
  document.getElementById("ics").disabled=!up.length;
  const n=up[0],next=document.getElementById("next");
  if(n){
    next.innerHTML=`<div class="k">${days(n.d)<=7?'<i class="dot"></i>':""}${t("next.k")}</div><div class="n" id="nextn"></div><div class="t">${L(n.p.name)}: ${fmt(n.d)}</div>`;
    countUp(document.getElementById("nextn"),days(n.d));
  }else next.innerHTML=`<div class="k">${t("next.k")}</div><div class="t">${t("next.none")}</div>`;
  let total=0,cnt=0;
  document.getElementById("todo").innerHTML=PROGRAMS.filter(p=>picked.includes(p.id)).map(p=>`<div class="grp">${L(p.name)}</div>`+p.todo.map((s,i)=>{const k=p.id+i;total++;if(done[k])cnt++;return`<label class="check ${done[k]?"done":""}"><input type="checkbox" data-k="${k}" ${done[k]?"checked":""}><span>${L(s)}</span></label>`}).join("")).join("")||`<p class="empty">${t("plan.todoEmpty")}</p>`;
  document.getElementById("bar").style.width=total?(cnt/total*100)+"%":"0";
  const rec=questRecs().progs;
  document.getElementById("progs").innerHTML=PROGRAMS.map((p,i)=>{const on=picked.includes(p.id),ch=changedAt(p.id);return`<article class="prog ${on?"on":""}" style="--i:${i}"><div class="where"><span>${L(p.where)}</span>${rec.includes(p.id)?`<span class="rec">${t("progs.rec")}</span>`:""}</div><h3>${L(p.name)}</h3>${ch?`<div class="chg">${t("progs.changed",{ago:ago(ch)})}</div>`:""}<ul>${p.req.map(r=>`<li>${L(r)}</li>`).join("")}</ul><div class="note">${eventsOf(p).map(e=>`${fmt(e.d)}: ${L(e.t)}${e.exp?` (${t("exp")})`:""}`).join("<br>")}</div><a href="${p.url}" target="_blank" rel="noopener">${t("progs.site")}</a><button class="toggle" data-id="${p.id}">${on?t("progs.in"):t("progs.add")}</button></article>`}).join("");
  document.getElementById("watchnote").textContent=WATCH?.at?t("watch.checked",{ago:ago(WATCH.at)}):"";
  const chg=picked.filter(changedAt);
  const wb=document.getElementById("watchbox");wb.hidden=!chg.length;
  wb.innerHTML=chg.length?`<h2>${t("watch.title")}</h2>`+chg.map(id=>`<div><b>${L(PROG[id].name)}</b> — ${t("watch.changed",{ago:ago(changedAt(id))})} <a class="link" href="${PROG[id].url}" target="_blank" rel="noopener">${t("progs.site")}</a></div>`).join(""):"";
  renderQuest();
  document.getElementById("docrows").innerHTML=docs.map((d,i)=>`<tr><td>${esc(docTitle(d))}${d.ex?`<span class="tag">${t("docs.example")}</span>`:""}</td><td>${esc(docType(d))}</td><td>${d.d?fmt(d.d)+" "+pill(days(d.d)):"—"}</td><td><select data-i="${i}">${[0,1,2,3].map(j=>`<option value="${j}" ${d.s==j?"selected":""}>${t("st."+j)}</option>`).join("")}</select></td><td><button class="x" data-del="${i}" aria-label="${t("docs.del")}">×</button></td></tr>`).join("");
  document.getElementById("docempty").hidden=docs.length>0;
}
function renderQuest(){
  const box=document.getElementById("questbox");
  if(!quest?.top?.length){box.innerHTML=`<div class="boxhead"><h2>${t("qr.title")}</h2><a class="btn sm" href="quest.html">${t("qr.go")}</a></div><p class="note">${t("qr.none")}</p>`;return}
  const r=questRecs(),missing=r.progs.filter(id=>!picked.includes(id));
  box.innerHTML=`<div class="boxhead"><h2>${t("qr.title")}</h2><a class="link" href="quest.html">${t("qr.again")}</a></div>
  <div class="grp">${t("qr.top")}</div><div class="chipset">${quest.top.slice(0,3).map(a=>`<span>${t("area."+a)}</span>`).join("")}</div>
  <div class="grp">${t("qr.progs")}</div><div class="chipset">${r.progs.map(id=>`<span class="p ${picked.includes(id)?"on":""}">${L(PROG[id].name)}${picked.includes(id)?" ✓":""}</span>`).join("")}</div>
  <div class="boxhead"><button class="btn sm" id="qadd" ${missing.length?"":"disabled"}>${missing.length?t("qr.add")+" (+"+missing.length+")":t("qr.added")}</button>
  ${r.pair?`<span class="note">${t("qr.pair")}: <b>${L(ENT_PAIRS[r.pair])}</b> · <button class="link" id="qcalc">${t("qr.calc")}</button></span>`:""}</div>`;
}

/* ---------- Календарь (.ics) ---------- */
function icsText(){
  const fold=s=>{const out=[];while(s.length>35){out.push(s.slice(0,35));s=" "+s.slice(35)}out.push(s);return out.join("\r\n")};
  const e8=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Navigator postupleniya//RU","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:"+e8(t("title"))];
  pickedEvents().filter(e=>days(e.d)>=0).forEach(e=>{
    const d=e.d.replace(/-/g,""),nx=new Date(e.d+"T00:00");nx.setDate(nx.getDate()+1);
    const sum=L(e.p.name)+": "+L(e.t);
    lines.push("BEGIN:VEVENT","UID:"+e.p.id+"-"+d+"@navigator","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+navIso(nx).replace(/-/g,""),
      "SUMMARY:"+e8(sum),"DESCRIPTION:"+e8((e.exp?t("ics.exp")+"\n":"")+e.p.url),"URL:"+e.p.url,
      "BEGIN:VALARM","TRIGGER:-P7D","ACTION:DISPLAY","DESCRIPTION:"+e8(t("ics.alarm7",{t:sum})),"END:VALARM",
      "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:"+e8(t("ics.alarm1",{t:sum})),"END:VALARM","END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.map(fold).join("\r\n")+"\r\n";
}
document.getElementById("ics").addEventListener("click",()=>{download("deadlines.ics",icsText(),"text/calendar;charset=utf-8");toast(t("plan.icsDone"))});

/* ---------- Калькулятор ЕНТ ---------- */
function entCalc(){
  const vals=ENT_SUBJECTS.map(s=>{const v=ent.s[s.k];return v===""||v==null?null:Math.max(0,Math.min(s.max,+v))});
  const filled=vals.some(v=>v!=null),total=vals.reduce((a,v)=>a+(v||0),0);
  const low=ENT_SUBJECTS.filter((s,i)=>vals[i]!=null&&vals[i]<s.min||filled&&vals[i]==null);
  return{vals,filled,total,valid:filled&&!low.length,low};
}
function renderEntInputs(){
  document.getElementById("subj").innerHTML=ENT_SUBJECTS.map(s=>`<label for="e-${s.k}">${L(s.name)}<small>${t("ent.subjMin",{n:s.min,max:s.max})}</small></label><input type="number" id="e-${s.k}" data-k="${s.k}" min="0" max="${s.max}" inputmode="numeric" value="${ent.s[s.k]??""}">`).join("");
  const qp=questRecs().pair;
  document.getElementById("pair").innerHTML=`<option value="">${t("ent.pairAll")}</option>`+Object.keys(ENT_PAIRS).map(k=>`<option value="${k}" ${(ent.pair||qp)===k?"selected":""}>${L(ENT_PAIRS[k])}</option>`).join("");
  document.getElementById("pairnote").textContent=!ent.pair&&qp?t("ent.fromQuest"):"";
}
function renderEnt(){
  const c=entCalc(),pair=document.getElementById("pair").value;
  document.querySelectorAll("#subj input").forEach((el,i)=>el.classList.toggle("low",c.vals[i]!=null&&c.vals[i]<ENT_SUBJECTS[i].min));
  document.getElementById("enttotal").textContent=c.total;
  document.getElementById("entvalid").textContent=!c.filled?"":c.valid?t("ent.valid"):t("ent.invalid",{list:c.low.map(s=>L(s.name)).join(", ")});
  document.getElementById("floors").innerHTML=[50,65,70,75].map(f=>{const ok=c.valid&&c.total>=f;return`<div class="floor"><span>${t("floor."+f)} · ${f}</span>${c.filled?`<span class="pill ${ok?"p-good":"p-bad"}">${ok?"✓":"✗"}</span>`:""}</div>`}).join("");
  const pos=v=>(v/140*100).toFixed(1)+"%";
  const list=ENT_GROUPS.filter(g=>!pair||g.pair===pair).sort((a,b)=>b.med-a.med);
  document.getElementById("groups").innerHTML=list.map((g,i)=>{
    let st="";
    if(c.filled){const k=!c.valid||c.total<g.floor?["below","p-bad"]:c.total>=g.med?["high","p-good"]:c.total>=g.min?["mid","p-soon"]:["low","p-bad"];st=`<span class="pill ${k[1]}">${t("ent."+k[0])}</span>`}
    return`<div class="g" style="--i:${i}"><div><b>${L(g.name)}</b><div class="meta">${g.code?g.code+" · ":""}${L(ENT_PAIRS[g.pair])} · ${t("ent.min")} ${g.min} · ${t("ent.med")} ${g.med}${g.grants?" · "+t("ent.grants",{n:g.grants.toLocaleString("ru-RU")}):""}</div></div>${st}
    <div class="scale" aria-hidden="true"><i class="rail"></i><i class="rng" style="left:${pos(g.min)};width:calc(${pos(g.med)} - ${pos(g.min)})"></i><i class="mk" style="left:${pos(Math.max(g.min,g.floor))}"></i><i class="mk med" style="left:${pos(g.med)}"></i>${c.filled?`<i class="you" style="left:${pos(c.total)}"></i>`:""}</div></div>`}).join("");
}
document.getElementById("subj").addEventListener("input",e=>{const k=e.target.dataset.k;if(!k)return;ent.s[k]=e.target.value;save("nav.ent",ent);renderEnt()});
document.getElementById("pair").addEventListener("change",e=>{ent.pair=e.target.value;save("nav.ent",ent);document.getElementById("pairnote").textContent="";renderEnt()});

/* ---------- Отчёт куратору ---------- */
function report(){const c=entCalc();return{v:1,n:me.n.trim(),c:me.c.trim(),at:Date.now(),p:picked,d:Object.keys(done).filter(k=>done[k]),docs:docs.map(d=>({t:d.t,s:d.s,d:d.d||""})),e:c.filled?{t:c.total,v:c.valid}:null,q:quest?.top?.slice(0,3)||null}}
function reportCode(){const b=new TextEncoder().encode(JSON.stringify(report()));let s="";b.forEach(x=>s+=String.fromCharCode(x));return"NAV1."+btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function needName(){if(me.n.trim())return true;toast(t("cur.needName"));document.getElementById("me-n").focus();return false}
document.getElementById("me-n").value=me.n;document.getElementById("me-c").value=me.c;
["me-n","me-c"].forEach(id=>document.getElementById(id).addEventListener("input",e=>{me[id==="me-n"?"n":"c"]=e.target.value;save("nav.me",me)}));
document.getElementById("rep-copy").addEventListener("click",async()=>{if(!needName())return;const code=reportCode();
  try{await navigator.clipboard.writeText(code)}catch(e){const ta=document.createElement("textarea");ta.value=code;document.body.append(ta);ta.select();document.execCommand("copy");ta.remove()}
  toast(t("cur.copied"))});
document.getElementById("rep-file").addEventListener("click",()=>{if(!needName())return;download(`otchet-${me.n.trim().replace(/\s+/g,"-")}.json`,JSON.stringify(report(),null,1),"application/json");toast(t("cur.saved"))});

/* ---------- Новости: основной источник news.js (его пишет update-news.mjs по расписанию),
   запасной — RSS через публичные CORS-прокси. Последний результат кэшируется в localStorage ---------- */
const FEEDS=window.NEWS_FEEDS||[];
const PROXIES=[
 u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
 u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u),
 u=>"https://cors.eu.org/"+u
];
const STALE=35*60e3;
let news=load("nav.news",{at:0,items:[]});
let seenAt=load("nav.newsSeen",0);
let cat="all",loading=false;
function takeLocal(){const d=window.NEWS_DATA;if(d&&d.items?.length&&d.at>news.at){news={at:d.at,items:d.items,local:true};save("nav.news",news)}}
// Перечитываем news.js без перезагрузки страницы: работает и через file://, и на хостинге
function reloadLocal(){return new Promise(ok=>{const s=document.createElement("script");s.src="news.js?t="+Date.now();
  s.onload=s.onerror=()=>{s.remove();takeLocal();ok()};document.head.append(s)})}
takeLocal();

const strip=h=>{const x=new DOMParser().parseFromString(h||"","text/html").body.textContent||"";return x.replace(/\s+/g," ").trim()};
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"#";
function timeout(ms){const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal}
function parseXml(txt,feed){
  const x=new DOMParser().parseFromString(txt,"text/xml");
  const chan=x.querySelector("channel > title")?.textContent||"";
  return [...x.querySelectorAll("item")].map(it=>{
    const g=s=>it.querySelector(s)?.textContent||"";
    let title=g("title"),src=g("source");
    if(src&&title.endsWith(" - "+src))title=title.slice(0,-(src.length+3));
    const google=feed.url.includes("news.google.com");
    return{cat:feed.cat,title:title.trim(),link:g("link").trim(),at:Date.parse(g("pubDate"))||0,src:src||chan.replace(/:.*$/,""),desc:google?"":strip(g("description")).slice(0,260)};
  });
}
async function fetchFeed(feed){
  for(const p of PROXIES){
    try{const r=await fetch(p(feed.url),{signal:timeout(12000),cache:"no-store"});if(!r.ok)continue;
      const items=parseXml(await r.text(),feed);if(items.length)return items}catch(e){}
  }
  const r=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(feed.url),{signal:timeout(12000)});
  const j=await r.json();if(!j.items?.length)throw new Error("empty");
  return j.items.map(i=>({cat:feed.cat,title:i.title,link:i.link,at:Date.parse(i.pubDate.replace(" ","T")+"Z")||0,src:i.author||j.feed?.title||"",desc:feed.url.includes("news.google.com")?"":strip(i.description).slice(0,260)}));
}
async function refreshNews(){
  if(loading)return;loading=true;
  document.getElementById("refresh").classList.add("busy");
  if(!news.items.length)renderNews();
  await reloadLocal();
  if(Date.now()-news.at>STALE){
    const res=await Promise.allSettled(FEEDS.map(fetchFeed));
    const fresh=res.flatMap(r=>r.status==="fulfilled"?r.value:[]);
    if(fresh.length){
      const seen=new Set(),per={},since=Date.now()-21*864e5;
      news={at:Date.now(),items:fresh.filter(i=>i.title&&i.at>since).sort((a,b)=>b.at-a.at).filter(i=>{const k=i.title.toLowerCase().slice(0,60);if(seen.has(k))return false;seen.add(k);return true}).filter(i=>(per[i.cat]=(per[i.cat]||0)+1)<=30)};
      save("nav.news",news);
    }else news.failed=Date.now();
  }
  loading=false;document.getElementById("refresh").classList.remove("busy");
  renderNews();
}
function card(i,k){const isNew=i.at>seenAt&&seenAt>0;return`<a class="news" href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener" style="--i:${k}"><div class="meta"><span class="cat c-${i.cat}">${t("cat."+i.cat)}</span><span>${esc(i.src)}</span><span>${ago(i.at)}</span>${isNew?`<span class="new">${t("news.new")}</span>`:""}</div><h3>${esc(i.title)}</h3>${i.desc?`<p>${esc(i.desc)}</p>`:""}</a>`}
function renderNews(){
  const list=news.items.filter(i=>cat==="all"||i.cat===cat);
  const skel=n=>Array.from({length:n},()=>'<div class="skel"></div>').join("");
  document.getElementById("feed").innerHTML=list.length?list.slice(0,40).map(card).join(""):loading?skel(6):`<p class="empty">${t("news.empty")}</p>`;
  const a=news.items.filter(i=>i.cat==="adm").slice(0,innerWidth>=1280?5:4);
  document.getElementById("admfeed").innerHTML=a.length?a.map(card).join(""):loading?skel(4):`<p class="empty">${t("news.admEmpty")}</p>`;
  document.getElementById("newsstatus").textContent=loading&&!news.items.length?t("news.loading"):
    news.failed&&news.failed>news.at?(news.at?t("news.offline",{ago:ago(news.at)}):t("news.fail")):news.at?t("news.ok",{ago:ago(news.at)}):"";
  const fresh=news.items.filter(i=>i.at>seenAt).length,b=document.getElementById("newcount");
  b.hidden=!(seenAt&&fresh&&cur!=="news");b.textContent=fresh>99?"99+":fresh;
}

/* ---------- Вкладки ---------- */
let cur="plan";
const TABS=["plan","progs","ent","docs","news"];
function moveInd(){const b=document.querySelector(`nav [data-tab="${cur}"]`),ind=document.querySelector("nav .ind");ind.style.width=b.offsetWidth+"px";ind.style.transform=`translate(${b.offsetLeft}px,${b.offsetTop+b.offsetHeight-ind.parentElement.clientHeight}px)`}
function replay(p){p.classList.remove("enter");void p.offsetWidth;p.classList.add("enter")}
function showTab(tab){
  if(cur==="news"&&tab!=="news"){seenAt=Date.now();save("nav.newsSeen",seenAt)}
  cur=tab;
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===tab));
  TABS.forEach(n=>{const p=document.getElementById("p-"+n);p.hidden=n!==tab;if(n===tab)replay(p)});
  moveInd();
  if(tab==="news"){if(!seenAt){seenAt=Date.now();save("nav.newsSeen",seenAt)}if(Date.now()-news.at>STALE)refreshNews();renderNews()}
}
document.querySelectorAll(".panel").forEach(p=>p.addEventListener("animationend",e=>{if(e.target===p)p.classList.remove("enter")}));
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)showTab(b.dataset.tab)});
document.getElementById("allnews").addEventListener("click",()=>{setCat("adm");showTab("news")});
function setCat(c){cat=c;document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.cat===c));renderNews()}
document.getElementById("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;setCat(b.dataset.cat);replay(document.getElementById("p-news"))});
document.getElementById("refresh").addEventListener("click",refreshNews);
addEventListener("resize",moveInd);
document.fonts?.ready.then(moveInd);

document.getElementById("questbox").addEventListener("click",e=>{
  if(e.target.id==="qadd"){picked=[...new Set([...picked,...questRecs().progs])];save("nav.picked",picked);render()}
  if(e.target.id==="qcalc")showTab("ent");
});
document.getElementById("progs").addEventListener("click",e=>{const b=e.target.closest(".toggle");if(!b)return;
  const id=b.dataset.id;picked=picked.includes(id)?picked.filter(x=>x!==id):[...picked,id];save("nav.picked",picked);render()});
document.getElementById("todo").addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;done[k]=e.target.checked;save("nav.done",done);render()});
document.getElementById("docform").addEventListener("submit",e=>{e.preventDefault();const title=document.getElementById("d-title").value.trim();if(!title)return;
  docs.push({t:title,type:I18N.ru["doc."+document.getElementById("d-type").value],d:document.getElementById("d-due").value,s:0});save("nav.docs",docs);e.target.reset();render()});
document.getElementById("docrows").addEventListener("change",e=>{const i=e.target.dataset.i;if(i==null)return;docs[i].s=+e.target.value;save("nav.docs",docs)});
document.getElementById("docrows").addEventListener("click",e=>{const i=e.target.dataset.del;if(i==null)return;docs.splice(i,1);save("nav.docs",docs);render()});

/* ---------- Язык ---------- */
document.querySelector(".langs").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b||b.dataset.lang===LANG)return;
  setLang(b.dataset.lang);document.title=t("title");render();renderEntInputs();renderEnt();renderNews();moveInd()});

/* ---------- PWA: офлайн-режим и установка (работает на http/https, не через file://) ---------- */
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
let installEvt=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;document.getElementById("install").hidden=false});
document.getElementById("install").addEventListener("click",async()=>{if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;document.getElementById("install").hidden=true});

/* ---------- Автообновление: смена дня пересчитывает дедлайны, новости обновляются по таймеру и при возврате на вкладку ---------- */
function tick(){
  const now=new Date();now.setHours(0,0,0,0);if(+now!==+TODAY){TODAY=now;render()}
  if(Date.now()-news.at>STALE&&navigator.onLine!==false)refreshNews();else renderNews();
}
setInterval(tick,5*60e3);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
addEventListener("online",refreshNews);

applyI18n();document.title=t("title");
render();renderEntInputs();renderEnt();moveInd();renderNews();
if(location.hash&&TABS.includes(location.hash.slice(1)))showTab(location.hash.slice(1));
if(Date.now()-news.at>STALE)refreshNews();
</script>
