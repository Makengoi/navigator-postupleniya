body{margin:0}[hidden]{display:none!important}
/* Layout: одна карточка-миссия по центру, сверху маршрут из 8 точек, в конце профиль склонностей с полосами */
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --ink:#1B2433; --muted:#626D7B; --line:#E1DDD3;
  --accent:#0B7C83; --accent-soft:#DDF1F1; --sun:#C98A12; --sun-soft:#F8ECD0; --bad:#B23B3B; --bad-soft:#F7E1E1;
  --display:"Lora",Georgia,"Times New Roman",serif; --body:"Lora",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171F; --surface:#1B232E; --ink:#ECEFF3; --muted:#9AA6B4; --line:#2B3644;
  --accent:#3FC1C4; --accent-soft:#163A3E; --sun:#E8B54A; --sun-soft:#3A2F15; --bad:#EE8A8A; --bad-soft:#3B1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171F; --surface:#1B232E; --ink:#ECEFF3; --muted:#9AA6B4; --line:#2B3644;
  --accent:#3FC1C4; --accent-soft:#163A3E; --sun:#E8B54A; --sun-soft:#3A2F15; --bad:#EE8A8A; --bad-soft:#3B1E1E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4.5vw,32px);margin:0;line-height:1.15;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:60ch}
.route{display:flex;gap:6px;align-items:center}
.route i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.route i.done{background:var(--accent)}.route i.cur{background:var(--sun)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.role{display:flex;align-items:center;gap:12px}
.badge{width:44px;height:44px;border-radius:12px;background:var(--sun-soft);color:var(--sun);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.role small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em}
.role b{font-family:var(--display);font-weight:500;font-size:18px}
.task{margin:0;font-size:16px}
pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:500 15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--accent-soft);border-color:var(--accent)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fb{margin:0;padding:12px 14px;border-radius:10px;background:var(--bg);font-size:14px}
.rate{display:flex;flex-direction:column;gap:8px}
.rate p{margin:0;font-weight:600}
.stars{display:flex;gap:6px;flex-wrap:wrap}
.stars button{font:600 14px var(--body);min-width:44px;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;flex:1}
.stars button[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--surface)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.btn{align-self:flex-start;font:700 15px var(--body);background:var(--accent);color:var(--surface);border:0;border-radius:10px;padding:11px 20px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.res{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:150px 1fr 36px;gap:10px;align-items:center;font-size:14px}
.row .b{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.row .b i{display:block;height:100%;background:var(--accent);border-radius:99px}
.row.top .b i{background:var(--sun)}
.row span:last-child{text-align:right;font-variant-numeric:lining-nums;color:var(--muted)}
@media (max-width:480px){.row{grid-template-columns:110px 1fr 30px}}
.rec{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.rec h3{margin:0;font-family:var(--display);font-weight:500;font-size:17px}
.rec p{margin:0;font-size:14px}
.rec .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.note{font-size:13px;color:var(--muted);margin:0}
/* Motion — правила в .claude/skills/motion/SKILL.md */
:root{--dur-1:120ms;--dur-2:220ms;--dur-3:420ms;--stagger:40ms;--ease-out:cubic-bezier(.2,.8,.2,1);--ease-spring:cubic-bezier(.34,1.56,.64,1)}
.route i{transition:background var(--dur-3) var(--ease-out)}
.route i.cur{animation:pop var(--dur-2) var(--ease-spring)}
.card>*{animation:rise var(--dur-3) var(--ease-out) both}
.card>*:nth-child(2){animation-delay:calc(1*var(--stagger))}.card>*:nth-child(3){animation-delay:calc(2*var(--stagger))}.card>*:nth-child(4){animation-delay:calc(3*var(--stagger))}.card>*:nth-child(n+5){animation-delay:calc(4*var(--stagger))}
.opt,.stars button,.btn{transition:border-color var(--dur-1) var(--ease-out),background var(--dur-2) var(--ease-out),transform var(--dur-1) var(--ease-out)}
@media (hover:hover){.opt:hover:not(:disabled){transform:translateX(3px)}}
button:active:not(:disabled){transform:scale(.97)}
.opt.right,.stars button[aria-pressed="true"]{animation:pop var(--dur-2) var(--ease-spring)}
.opt.wrong{animation:shake 320ms var(--ease-out)}
#after>*{animation:rise var(--dur-3) var(--ease-out) both}
.row .b i{animation:grow 700ms var(--ease-out) both;animation-delay:calc(var(--i,0)*var(--stagger));transform-origin:left}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.92)}to{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{font:600 13px var(--body);color:var(--accent);text-decoration:none}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--surface)}
.langs button{font:700 12px var(--body);border:0;background:none;color:var(--muted);padding:4px 10px;border-radius:99px;cursor:pointer;transition:background var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.saved{margin:0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:14px}
a.btn{text-decoration:none;display:inline-block}
.themebtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0;transition:background var(--dur-2) var(--ease-out),transform var(--dur-1) var(--ease-out)}
.themebtn svg{width:16px;height:16px;animation:themeIn var(--dur-3) var(--ease-spring)}
@keyframes themeIn{from{transform:rotate(-90deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.brand{display:inline-flex;align-items:center;background:#fff;border-radius:12px;padding:6px 10px;text-decoration:none;flex:none}
.brand img{display:block;height:36px;width:auto}
body{transition:background-color var(--dur-3) var(--ease-out),color var(--dur-3) var(--ease-out)}
.topl{display:flex;align-items:center;gap:12px}
.topr{display:flex;align-items:center;gap:8px}

.stars button{font-family:var(--body);font-size:15px;min-height:44px}
.scale{font-size:13px}
.btn{font-size:16px;padding:12px 22px}
.row{font-size:15px}

.brandname:hover{color:var(--accent)}
.topl{gap:14px;min-width:0}

 {a:"law",role:T("Дипломат","Дипломат"),l:"§",task:T("Две страны спорят о квоте на воду из общей реки. Вы ведёте переговоры. Какой ход приблизит соглашение?","Екі ел ортақ өзеннің суына квота туралы дауласып жатыр. Сіз келіссөз жүргізесіз. Қай қадам келісімді жақындатады?"),
  opts:[T("Поддержать более сильную сторону","Күштірек тарапты қолдау"),T("Выяснить, что на самом деле нужно каждой стороне, и искать общий интерес","Әр тарапқа шын мәнінде не керек екенін анықтап, ортақ мүдде іздеу"),T("Отложить переговоры, пока спор не утихнет сам","Дау өздігінен басылғанша келіссөзді кейінге қалдыру")],ok:1,
  fb:T("Переговорщики ищут интересы за позициями: часто обеим сторонам нужна не вода вообще, а вода в определённый сезон.","Келіссөз жүргізушілер ұстанымның артындағы мүддені іздейді: көбіне екі тарапқа жалпы су емес, белгілі бір маусымдағы су керек.")},
 {a:"edu",role:T("Учитель","Мұғалім"),l:"✎",task:T("Семиклассник не понимает, что такое дробь 3/4. Какое объяснение сработает лучше всего?","Жетінші сынып оқушысы 3/4 бөлшегі не екенін түсінбейді. Қай түсіндіру ең жақсы әсер етеді?"),
  opts:[T("Дать определение из учебника и попросить выучить","Оқулықтағы анықтаманы беріп, жаттауды сұрау"),T("Разрезать пиццу на 4 части и взять 3","Пиццаны 4 бөлікке бөліп, 3-еуін алу"),T("Сказать, что поймёт позже","Кейін түсінесің деу")],ok:1,
  fb:T("Хороший педагог переводит абстракцию в то, что можно увидеть и потрогать.","Жақсы педагог абстракцияны көруге және ұстауға болатын нәрсеге айналдырады.")}
];
const RECS={
 it:{jobs:T("разработчик, специалист по данным, инженер по кибербезопасности","әзірлеуші, деректер маманы, киберқауіпсіздік инженері"),where:"NU (Computer Science), КБТУ, МУИТ, AITU"},
 eng:{jobs:T("инженер-строитель, робототехник, инженер-энергетик","құрылыс инженері, робототехник, энергетик инженер"),where:"NU (School of Engineering), Satbayev University, КазНУ"},
 med:{jobs:T("врач, фармацевт, медицинский исследователь","дәрігер, фармацевт, медициналық зерттеуші"),where:T("NU (School of Medicine), КазНМУ, Медицинский университет Астана","NU (School of Medicine), ҚазҰМУ, Астана медицина университеті")},
 biz:{jobs:T("экономист, финансовый аналитик, предприниматель, маркетолог","экономист, қаржы талдаушысы, кәсіпкер, маркетолог"),where:T("NU (GSB, экономика), КИМЭП, Нархоз","NU (GSB, экономика), КИМЭП, Нархоз")},
 des:{jobs:T("дизайнер интерфейсов, графический дизайнер, архитектор","интерфейс дизайнері, графикалық дизайнер, сәулетші"),ent:T("творческий экзамен (уточняйте в вузе)","шығармашылық емтихан (ЖОО-дан нақтылаңыз)"),where:T("КазГАСА, Satbayev University, зарубежные школы дизайна","ҚазБСҚА, Satbayev University, шетелдік дизайн мектептері")},
 sci:{jobs:T("биолог, химик, эколог, биотехнолог","биолог, химик, эколог, биотехнолог"),where:T("NU (School of Sciences), КазНУ им. аль-Фараби","NU (School of Sciences), әл-Фараби атындағы ҚазҰУ")},
 law:{jobs:T("юрист, дипломат, специалист по международным отношениям","заңгер, дипломат, халықаралық қатынастар маманы"),ent:T("всемирная история + основы права, или иностранный язык","дүниежүзі тарихы + құқық негіздері, немесе шет тілі"),where:"КазНУ (МО), КИМЭП, Maqsut Narikbayev University"},
 edu:{jobs:T("учитель, школьный психолог, методист, EdTech-специалист","мұғалім, мектеп психологы, әдіскер, EdTech маманы"),ent:T("зависит от предмета, который будете преподавать","сабақ беретін пәніңізге байланысты"),where:T("КазНПУ им. Абая, ЕНУ, педагогические программы NU (GSE)","Абай атындағы ҚазҰПУ, ЕҰУ, NU педагогикалық бағдарламалары (GSE)")}
};
let i=0,answered=null,rating=0,finished=false;const score={};AREAS.forEach(k=>score[k]=0);
const card=document.getElementById("card");

function route(){document.getElementById("route").innerHTML=MISSIONS.map((_,k)=>`<i class="${k<i?"done":k===i?"cur":""}"></i>`).join("")}
function show(){
  finished=false;route();answered=null;rating=0;const m=MISSIONS[i];
  card.innerHTML=`<div class="role"><div class="badge">${m.l.replace("<","&lt;").replace(">","&gt;")}</div><div><small>${t("q.mission",{i:i+1,n:MISSIONS.length})}</small><b>${L(m.role)}</b></div></div>
  <p class="task">${L(m.task)}</p>${m.code?`<pre>${m.code}</pre>`:""}
  <div class="opts">${m.opts.map((o,k)=>`<button class="opt" data-k="${k}">${L(o)}</button>`).join("")}</div>
  <div id="after" hidden></div>`;
}
function after(){
  const m=MISSIONS[i],a=document.getElementById("after");a.hidden=false;
  a.innerHTML=`<p class="fb"><b>${answered===m.ok?t("q.right"):t("q.wrong")}</b> ${L(m.fb)}</p>
  <div class="rate"><p>${t("q.rate",{role:L(m.role)})}</p>
  <div class="stars">${[1,2,3,4,5].map(n=>`<button data-r="${n}" aria-pressed="${rating===n}">${n}</button>`).join("")}</div>
  <div class="scale"><span>${t("q.lo")}</span><span>${t("q.hi")}</span></div></div>
  <button class="btn" id="go" ${rating?"":"disabled"}>${i<MISSIONS.length-1?t("q.next"):t("q.show")}</button>`;
  a.style.cssText="display:flex;flex-direction:column;gap:14px";
}
card.addEventListener("click",e=>{
  const o=e.target.closest(".opt");
  if(o&&answered===null){
    const m=MISSIONS[i];answered=+o.dataset.k;
    card.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===m.ok)b.classList.add("right");else if(k===answered)b.classList.add("wrong")});
    after();return;
  }
  const r=e.target.closest("[data-r]");
  if(r){rating=+r.dataset.r;card.querySelectorAll("[data-r]").forEach(b=>b.setAttribute("aria-pressed",b===r));document.getElementById("go").disabled=false;return}
  if(e.target.id==="go"){const m=MISSIONS[i];score[m.a]=rating*2+(answered===m.ok?1:0);i++;i<MISSIONS.length?show():result();return}
  if(e.target.id==="again"){i=0;AREAS.forEach(k=>score[k]=0);show()}
});
function result(){
  finished=true;route();
  const sorted=AREAS.slice().sort((a,b)=>score[b]-score[a]);
  // Навигатор (index.html) читает этот результат и подбирает программы и предметы ЕНТ
  try{localStorage.setItem("nav.quest",JSON.stringify({top:sorted,scores:score,at:Date.now()}))}catch(e){}
  const max=11;
  card.innerHTML=`<div class="role"><div class="badge">★</div><div><small>${t("q.done")}</small><b>${t("q.profile")}</b></div></div>
  <div class="res">${sorted.map((k,n)=>`<div class="row ${n<3?"top":""}" style="--i:${n}"><span>${t("area."+k)}</span><span class="b"><i style="width:${score[k]/max*100}%"></i></span><span>${score[k]}</span></div>`).join("")}</div>
  ${sorted.slice(0,3).map(k=>`<div class="rec"><h3>${t("area."+k)}</h3><div class="k">${t("q.jobs")}</div><p>${L(RECS[k].jobs)}</p><div class="k">${t("q.ent")}</div><p>${L(RECS[k].ent||ENT_PAIRS[QUEST_MAP[k].pair])}</p><div class="k">${t("q.where")}</div><p>${L(RECS[k].where)}</p></div>`).join("")}
  <p class="saved">${t("q.saved")}</p>
  <a class="btn" href="index.html">${t("q.toNav")}</a>
  <p class="note">${t("q.note")}</p>
  <button class="btn ghost" id="again">${t("q.again")}</button>`;
}
document.querySelector(".langs").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b||b.dataset.lang===LANG)return;
  setLang(b.dataset.lang);document.title=t("q.title");
  if(finished)result();else{const keep=answered,r=rating;show();if(keep!==null){answered=keep;rating=r;const m=MISSIONS[i];card.querySelectorAll(".opt").forEach((x,k)=>{x.disabled=true;if(k===m.ok)x.classList.add("right");else if(k===answered)x.classList.add("wrong")});after()}}});
applyI18n();document.title=t("q.title");
show();
</script>
</body>
